name: tests

on:
  push:
    paths:
      - 'book-kit/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'book-kit/**'

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run pytest
        working-directory: book-kit
        run: python -m pytest tests/ -v --tb=short

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run --self-check on every script
        run: |
          set -e
          for script in book-kit/book_workflow/scripts/*.py; do
            echo "--- self-check: $script ---"
            if grep -q '"--self-check"' "$script"; then
              python "$script" --self-check
            else
              # scripts without --self-check still run to confirm exit 0 (no argparse usage errors etc.)
              python "$script" || true
            fi
          done
