name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete existing release for tag (if any)
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          existing=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*' || echo "")
          if [ -n "$existing" ]; then
            echo "Existing release id=$existing for tag $TAG — deleting"
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$existing" \
              > /dev/null
          fi

      - name: Build release payload from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -e
          python3 - <<'PYEOF'
          import os, re, json
          tag = os.environ["TAG"]
          with open("book-kit/CHANGELOG.md", encoding="utf-8") as f:
              text = f.read()
          pat = re.compile(
              r"^##\s+" + re.escape(tag) + r"[^\n]*\n(.*?)(?=^##\s+|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          m = pat.search(text)
          body = m.group(1).strip() if m else f"Release {tag}"
          payload = {
              "tag_name": tag,
              "name": tag,
              "body": body,
              "draft": False,
              "prerelease": False,
          }
          with open("/tmp/release-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          print(f"body length: {len(body)}")
          print(f"payload written to /tmp/release-payload.json")
          PYEOF

      - name: Create release via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/release-payload.json \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            | head -c 500
          echo ""
          echo "---"
          echo "Release created. Verify at: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
