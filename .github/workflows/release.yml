name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract CHANGELOG entry for tag
        id: changelog
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "Extracting CHANGELOG block for $TAG from book-kit/CHANGELOG.md"
          python3 - <<'PYEOF'
          import re, os, sys
          tag = os.environ.get("TAG", "v0.0.0")
          with open("book-kit/CHANGELOG.md", encoding="utf-8") as f:
              text = f.read()
          pat = re.compile(
              r"^##\s+" + re.escape(tag) + r"[^\n]*\n(.*?)(?=^##\s+|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          m = pat.search(text)
          if not m:
              print(f"::warning::no CHANGELOG entry for {tag}; using default body")
              body = f"Release {tag}"
          else:
              body = m.group(1).strip()
          body_path = os.environ["GITHUB_OUTPUT"]
          with open(body_path, "a", encoding="utf-8") as f:
              f.write("body<<EOF\n" + body + "\nEOF\n")
              f.write("name=" + tag + "\n")
          PYEOF

      - name: Delete existing release for tag (if any)
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          existing=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*' || echo "")
          if [ -n "$existing" ]; then
            echo "Existing release id=$existing for tag $TAG — deleting before re-create"
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$existing" \
              > /dev/null
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.changelog.outputs.name }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false
          fail_on_unmatched_files: false
