name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete existing release for tag (if any)
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          existing=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*' || echo "")
          if [ -n "$existing" ]; then
            echo "Existing release id=$existing for tag $TAG — deleting before re-create"
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$existing" \
              > /dev/null
          fi

      - name: Build release body from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -e
          echo "Building release body for $TAG"
          python3 - <<'PYEOF'
          import os, re
          tag = os.environ["TAG"]
          with open("book-kit/CHANGELOG.md", encoding="utf-8") as f:
              text = f.read()
          pat = re.compile(
              r"^##\s+" + re.escape(tag) + r"[^\n]*\n(.*?)(?=^##\s+|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          m = pat.search(text)
          body = m.group(1).strip() if m else f"Release {tag}"
          with open("/tmp/release-body.md", "w", encoding="utf-8") as f:
              f.write(body)
          with open("/tmp/release-name", "w", encoding="utf-8") as f:
              f.write(tag)
          print(f"body length: {len(body)}")
          PYEOF
          echo "body preview:"
          head -c 200 /tmp/release-body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name_file: /tmp/release-name
          body_path: /tmp/release-body.md
          generate_release_notes: false
          fail_on_unmatched_files: false
