<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Tablet Mockup Template — am-design</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {
  --bg: #FAFAFA;
  --surface: #FFFFFF;
  --ink: #1A1A1A;
  --ink-2: #4A4A4A;
  --ink-3: #8A8A8A;
  --line: #E8E8E8;
  --primary: #3B5BFF;
  --primary-tint: #EAEEFF;
  --r-sm: 10px; --r-md: 16px; --r-lg: 24px;
  --font-sans: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #ECEFF3; font-family: var(--font-sans); color: var(--ink); padding: 32px; }
.frame { width: 1024px; height: 768px; margin: 0 auto; background: var(--bg); border-radius: 28px; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.25); position: relative; overflow: hidden; }
.status-bar { position: absolute; top: 0; left: 0; right: 0; height: 24px; background: var(--bg); display: flex; justify-content: space-between; align-items: center; padding: 0 16px; font-size: 12px; color: var(--ink-2); z-index: 5; border-bottom: 1px solid var(--line); }
.layout { display: grid; grid-template-columns: 240px 1fr; height: 100%; padding-top: 24px; }
.sidebar { background: var(--surface); border-inline-end: 1px solid var(--line); padding: 20px 16px; overflow-y: auto; }
.sidebar h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); margin-bottom: 10px; padding: 0 8px; }
.sidebar a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-sm); color: var(--ink-2); text-decoration: none; font-size: 14px; }
.sidebar a.active { background: var(--primary-tint); color: var(--primary); font-weight: 600; }
.sidebar a:hover { background: var(--bg); }
.main { padding: 28px 32px; overflow-y: auto; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.topbar h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.btn { background: var(--primary); color: #fff; padding: 10px 18px; border-radius: var(--r-md); font-weight: 600; font-size: 14px; text-decoration: none; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 20px; }
.card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.card .value { font-size: 28px; font-weight: 600; margin-top: 6px; }
.note { font-family: ui-monospace, monospace; background: #FFF7CC; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="frame">
  <div class="status-bar">
    <span>9:41 AM · Wed Sep 4</span>
    <span>Wi-Fi · 87%</span>
  </div>
  <div class="layout">
    <aside class="sidebar">
      <h3>Main</h3>
      <a href="#" class="active">Dashboard</a>
      <a href="#">Projects</a>
      <a href="#">Tasks</a>
      <a href="#">Calendar</a>
      <h3 style="margin-top: 20px;">Settings</h3>
      <a href="#">Profile</a>
      <a href="#">Team</a>
      <a href="#">Billing</a>
    </aside>
    <main class="main">
      <div class="topbar">
        <h1>Dashboard <span class="note">1024×768</span></h1>
        <a href="#" class="btn">+ New</a>
      </div>
      <div class="grid">
        <div class="card"><div class="label">Active projects</div><div class="value">14</div></div>
        <div class="card"><div class="label">Tasks due today</div><div class="value">7</div></div>
        <div class="card"><div class="label">Completion</div><div class="value">68%</div></div>
      </div>
      <div class="card" style="margin-top: 16px;">
        <div class="label">Recent activity</div>
        <p style="margin-top: 10px; color: var(--ink-2); font-size: 14px;">Replace with your tablet-screen content.</p>
      </div>
    </main>
  </div>
</div>
</body>
</html>
