<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Mobile Mockup Template — am-design</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {
  --bg: #FAFAFA;
  --surface: #FFFFFF;
  --ink: #1A1A1A;
  --ink-2: #4A4A4A;
  --ink-3: #8A8A8A;
  --line: #E8E8E8;
  --primary: #3B5BFF;
  --primary-tint: #EAEEFF;
  --r-sm: 8px; --r-md: 14px; --r-lg: 22px; --r-pill: 999px;
  --font-sans: -apple-system, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #ECEFF3; font-family: var(--font-sans); color: var(--ink); padding: 32px; }
.frame { width: 390px; height: 844px; margin: 0 auto; background: var(--bg); border-radius: 44px; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.25); position: relative; overflow: hidden; }
.notch { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 34px; background: #000; border-radius: 20px; z-index: 10; }
.status-bar { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 28px 8px; font-size: 15px; font-weight: 600; color: var(--ink); z-index: 5; }
.status-bar .icons { display: flex; gap: 5px; align-items: center; color: var(--ink); }
.screen { position: absolute; inset: 0; padding-top: 54px; padding-bottom: 34px; overflow: hidden; }
.content { padding: 16px 20px; height: 100%; overflow-y: auto; }
.home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--ink); border-radius: 3px; opacity: 0.85; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
p { color: var(--ink-2); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; margin-top: 12px; }
.btn { display: inline-block; background: var(--primary); color: #fff; padding: 14px 22px; border-radius: var(--r-md); font-weight: 600; font-size: 15px; text-decoration: none; }
.note { font-family: ui-monospace, "SF Mono", Menlo, monospace; background: #FFF7CC; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="frame">
  <div class="notch"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="8" width="2" height="4"/><rect x="4" y="6" width="2" height="6"/><rect x="8" y="3" width="2" height="9"/><rect x="12" y="0" width="2" height="12"/></svg>
      <svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="1"><path d="M1 5 C4 1, 10 1, 13 5"/><circle cx="7" cy="8" r="1" fill="currentColor"/></svg>
      <svg width="22" height="10" viewBox="0 0 22 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="1" y="1" width="18" height="8" rx="2"/><rect x="3" y="3" width="13" height="4" fill="currentColor"/><rect x="20" y="3" width="2" height="4" fill="currentColor"/></svg>
    </span>
  </div>
  <div class="screen">
    <div class="content">
      <p style="font-size: 13px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px;">Mobile Template · <span class="note">dir="ltr"</span></p>
      <h1>Hello, world.</h1>
      <p style="margin-top: 8px;">390×844 phone frame. Replace this content with your screen.</p>
      <div class="card">
        <p style="font-size: 13px; color: var(--ink-3); margin-bottom: 8px;">Card</p>
        <p>Use <code style="background: var(--primary-tint); padding: 2px 6px; border-radius: 4px;">var(--primary)</code> for emphasis.</p>
        <div style="margin-top: 14px;">
          <a href="#" class="btn">Primary action</a>
        </div>
      </div>
      <div class="card">
        <p style="font-size: 13px; color: var(--ink-3); margin-bottom: 8px;">RTL conversion</p>
        <p>To switch to Arabic / Hebrew / Persian, change <code style="background: var(--primary-tint); padding: 2px 6px; border-radius: 4px;">dir="ltr"</code> to <code style="background: var(--primary-tint); padding: 2px 6px; border-radius: 4px;">dir="rtl"</code> and <code style="background: var(--primary-tint); padding: 2px 6px; border-radius: 4px;">lang="ar"</code>.</p>
      </div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div>
</body>
</html>
